name: New speaker profile
description: Add or change a speaker profile for the speakers page
title: "Speaker: "
labels: ["speaker"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! This repository is public. Profiles contain **public information only** and are published **with the speaker's consent**.
        No e-mail addresses, phone numbers or home addresses.
  - type: input
    id: name
    attributes: { label: Name (as the speaker wants it shown) }
    validations: { required: true }
  - type: input
    id: affiliation
    attributes: { label: Affiliation and role (optional) }
  - type: textarea
    id: bio
    attributes:
      label: Short bio (optional, 1-3 factual sentences, max 400 characters)
  - type: textarea
    id: links
    attributes:
      label: Public links (optional)
      description: Website, GitHub, Mastodon, LinkedIn. One per line.
  - type: input
    id: events
    attributes: { label: Event(s) the speaker appears at (link or issue number), optional }
  - type: dropdown
    id: consent
    attributes:
      label: Does the speaker agree to be listed publicly?
      options: ["Yes, the speaker agreed", "I am the speaker", "Not sure, please ask"]
    validations: { required: true }
  - type: input
    id: source
    attributes: { label: Where did you verify this information?, placeholder: "https://" }
    validations: { required: true }
